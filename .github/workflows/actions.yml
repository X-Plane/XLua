name: XLua2 Build

on: [push]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Configure
      run: cmake -B build -A x64

    - name: Build
      run: cmake --build build --config Release

    - name: Archive production artifacts
      uses: actions/upload-artifact@v6
      with:
        name: xlua2_win
        path: |
          build/win_x64/xlua2.xpl
          build/win_x64/xlua2.pdb
        if-no-files-found: error

  build-mac:
    runs-on: macos-15
    env:
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Credentials
        uses: apple-actions/import-codesign-certs@v6
        with:
          p12-file-base64: ${{ secrets.APPLE_DEV_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_DEV_CERTIFICATE_PASSWORD }}

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Sign
        run: |
          codesign --sign "Developer ID Application: Laminar Research (LPH4NFE92D)" \
                   --timestamp \
                   --options runtime \
                   build/mac_x64/mac.xpl

      - name: Notarize
        run: |
          zip -r xlua2_mac.zip build/mac_x64/mac.xpl
          xcrun notarytool submit xlua2_mac.zip \
              --apple-id "${APPLE_ID}" \
              --team-id "${APPLE_TEAM_ID}" \
              --password "${APP_SPECIFIC_PASSWORD}" \
              --wait \
              --timeout 10m

      - name: Archive production artifacts
        uses: actions/upload-artifact@v6
        with:
          name: xlua2_mac
          path: build/mac_x64/mac.xpl
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install OpenGL development headers
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Archive production artifacts
        uses: actions/upload-artifact@v6
        with:
          name: xlua2_lin
          path: build/lin_x64/lin.xpl
          if-no-files-found: error

  package:
    runs-on: ubuntu-latest
    needs: [build-windows, build-mac, build-linux]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          name: xlua2_win
          path: staging/win_x64

      - uses: actions/download-artifact@v8
        with:
          name: xlua2_mac
          path: xlua2/mac_x64

      - uses: actions/download-artifact@v8
        with:
          name: xlua2_lin
          path: xlua2/lin_x64

      - name: Assemble package tree
        run: |
          mkdir -p xlua2/win_x64
          cp staging/win_x64/xlua2.xpl xlua2/win_x64/xlua2.xpl
          mv xlua2/mac_x64/mac.xpl xlua2/mac_x64/xlua2.xpl
          mv xlua2/lin_x64/lin.xpl xlua2/lin_x64/xlua2.xpl
          cp deploy/init.lua xlua2/init.lua
          cp -r deploy/include xlua2/include
          cp -r deploy/example_scripts xlua2/example_scripts
          cp -r deploy/scripts xlua2/scripts
          cp -r deploy/docs xlua2/docs

      - name: Create zip
        run: zip -r xlua2.zip xlua2/

      - uses: actions/upload-artifact@v6
        with:
          name: xlua2
          path: xlua2.zip
          if-no-files-found: error
