name: XLua Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v1.0.2

    - name: Build
      working-directory: ${{env.GITHUB_WORKSPACE}}
      # Add additional options to the MSBuild command line here (like platform or verbosity level).
      # See https://docs.microsoft.com/visualstudio/msbuild/msbuild-command-line-reference
      run: |
        msbuild xlua.vcxproj /p:Platform=x64 /p:Configuration=Release /m
        mkdir jenkins\build_products\win_x64
        move Release\plugins\win_x64\xlua.pdb jenkins\build_products\win_x64\xlua.pdb
        move Release\plugins\win_x64\xlua.xpl jenkins\build_products\win_x64\xlua.xpl
      
    - name: Archive production artifacts
      uses: actions/upload-artifact@v4
      with:
        name: win_x64
        path: |
          jenkins\build_products\win_x64\xlua.pdb
          jenkins\build_products\win_x64\xlua.xpl
        if-no-files-found: error
          
  build-mac:
    runs-on: macos-14
    env:
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          
      - name: Setup Credentials
        uses: apple-actions/import-codesign-certs@v1
        with: 
          p12-file-base64: ${{ secrets.APPLE_DEV_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_DEV_CERTIFICATE_PASSWORD }}
          
      - name: Build
        run: |
          ./jenkins_driver.sh
          
      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac_x64
          path: |
            jenkins/build_products/mac_x64/xlua.xpl
          if-no-files-found: error
          
  build-linux:
    runs-on: ubuntu-latest
    container:
        image: ghcr.io/x-plane/xlua_builder:latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install g++-12
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-12
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-12 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-12 100

      - name: Build
        run: |
          ./jenkins_driver.sh

      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lin_x64
          path: |
            jenkins/build_products/lin_x64/xlua.xpl
          if-no-files-found: error

  create-archive:
    needs: [build-windows, build-mac, build-linux]
    
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gather Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./deploy/

      - name: Zip Artifacts
        run: |
          ls -R ./
          cd ./deploy
          zip -r ../release.zip ./

      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
           name: release_archive
           path: ./release.zip
           if-no-files-found: error
