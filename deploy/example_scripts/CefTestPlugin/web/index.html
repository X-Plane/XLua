<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CEF Test Plugin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
    <div id="topbar">
        <div class="title">CEF Test Plugin</div>
        <div class="pills">
            <span class="pill pass" id="pass-pill">0 PASS</span>
            <span class="pill fail" id="fail-pill">0 FAIL</span>
            <span class="pill pending" id="pending-pill">14 PENDING</span>
        </div>
    </div>

    <div id="sidebar"></div>
    <div id="panel"></div>

    <div id="log"></div>
</div>

<template id="tab-template">
    <button class="tab-button" data-tab="">
        <span class="status-dot"></span>
        <span class="label"></span>
    </button>
</template>

<script src="main.js"></script>
</body>
</html>
